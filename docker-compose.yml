services:
  ards-ai-api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - qdrant

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ards
      POSTGRES_PASSWORD: ards
      POSTGRES_DB: ards_ai
    ports:
      - "5432:5432"
    volumes:
      - ards_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
    volumes:
      - ards_qdrant:/qdrant/storage

volumes:
  ards_postgres:
  ards_qdrant:
